<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HalfBricked</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="shortcut icon" href="./favicon.ico">
<link rel="apple-touch-icon" href="./favicon.png">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#d8dbe5;font-family:system-ui,sans-serif}
main{position:fixed;inset:0}
#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);margin:0;color:#8d94a8}
/* The game lays itself out to the size of its canvas, so the canvas is the whole window. */
canvas{position:fixed;inset:0;display:block;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;image-rendering:auto}
</style>
</head>
<body>
<main>
<p id="status">Loading HalfBricked...</p>
<script>
// ?perf: a log of everything that stalls the page, independent of the game's own drawing (a frozen game cannot
// draw its own readout). Three sources are merged on one timeline:
//   long task  - the browser reports main-thread work longer than 50 ms (after it ends)
//   frame gap  - requestAnimationFrame callbacks more than 100 ms apart
//   go         - operations the game itself timed (blocking downloads, PNG/Ogg decodes, level start steps, GC)
(function () {
  if (!/[?&]perf/.test(location.search)) return;
  const events = [];
  const t0 = performance.now();
  function push(kind, ms, label, end) {
    events.push({ at: end === undefined ? performance.now() : end, kind, ms, label });
    if (events.length > 400) events.shift();
  }
  window.aozMark = (label, ms) => push("go", ms, label);
  try {
    new PerformanceObserver(list => {
      for (const e of list.getEntries()) push("longtask", e.duration, "main thread busy", e.startTime + e.duration);
    }).observe({ entryTypes: ["longtask"] });
  } catch (e) {}
  let last = performance.now(), frames = [], worst = 0;
  function tick(now) {
    const gap = now - last;
    last = now;
    if (!document.hidden) {
      frames.push(now);
      while (frames.length && now - frames[0] > 1000) frames.shift();
      if (gap > 100 && gap < 30000) push("frame gap", gap, "no frame for " + Math.round(gap) + " ms", now);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  const panel = document.createElement("div");
  panel.style.cssText = "position:fixed;left:8px;top:8px;z-index:99999;width:min(760px,calc(100vw - 16px));max-height:60vh;overflow:auto;" +
    "background:rgba(8,10,16,.88);color:#e8ebf4;font:13px/1.45 ui-monospace,Consolas,monospace;padding:8px 10px;border-radius:6px;white-space:pre;";
  const head = document.createElement("div");
  const body = document.createElement("div");
  const bar = document.createElement("div");
  bar.style.cssText = "margin-bottom:6px";
  function button(text, fn) {
    const b = document.createElement("button");
    b.textContent = text;
    b.style.cssText = "margin-right:6px;font:12px system-ui;padding:2px 8px";
    b.onclick = fn;
    bar.appendChild(b);
  }
  button("copy log", () => {
    const text = events.map(e => (((e.at - t0) / 1000).toFixed(2) + "s  " + e.kind + "  " + e.ms.toFixed(0) + " ms  " + e.label)).join("\n");
    navigator.clipboard && navigator.clipboard.writeText(text);
  });
  button("clear", () => { events.length = 0; });
  button("hide", () => { panel.style.display = "none"; });
  panel.append(bar, head, body);
  document.body.appendChild(panel);

  function render() {
    const now = performance.now();
    const recent = events.filter(e => now - e.at < 60000);
    const stalls = recent.filter(e => e.kind !== "go" && e.ms >= 100);
    const worstGap = stalls.reduce((m, e) => Math.max(m, e.ms), 0);
    head.textContent = "browser frames/s: " + frames.length + "   stalls >100 ms in the last 60 s: " + stalls.length +
      "   longest: " + Math.round(worstGap) + " ms\n" +
      "go = timed by the game (a blocking download or decode); longtask/frame gap = measured by the browser\n";
    const rows = events.slice(-30).reverse().map(e => {
      const age = ((now - e.at) / 1000).toFixed(1).padStart(5) + "s ago";
      const ms = (Math.round(e.ms) + " ms").padStart(9);
      const tag = e.kind.padEnd(9);
      const hot = e.ms >= 250 ? " <<<" : "";
      return age + "  " + tag + ms + "  " + e.label + hot;
    });
    body.textContent = rows.length ? rows.join("\n") : "(no stalls recorded yet)";
  }
  setInterval(render, 400);
  render();
})();
</script>
<script>
// Two ways to run, chosen by config.json next to this page (written by the export):
//   hosted  (no config.json, or {"mode":"hosted"}): the page ships the game's data below ./data and the game fetches it.
//   apk     ({"mode":"apk"}): the page ships no game data. The player picks their own Age of Zombies APK; the game
//           unpacks and converts it in the browser (memfs.js is its file system), and the result is kept in this
//           browser's IndexedDB so the next visit starts at once. Nothing is uploaded anywhere.
const status = document.getElementById("status");
const loadScript = src => new Promise((resolve, reject) => {
	const tag = document.createElement("script");
	tag.src = src;
	tag.onload = resolve;
	tag.onerror = () => reject(new Error("could not load " + src));
	document.head.appendChild(tag);
});

async function instantiate(go) {
	try {
		return await WebAssembly.instantiateStreaming(fetch("./aoz.wasm"), go.importObject);
	} catch (e) {
		const response = await fetch("./aoz.wasm");
		return await WebAssembly.instantiate(await response.arrayBuffer(), go.importObject);
	}
}

async function startGame() {
	const go = new Go();
	const result = await instantiate(go);
	status.remove();
	go.run(result.instance);
}

// ---- bring-your-own-APK mode ----------------------------------------------------------------------------------
const DB_NAME = "halfbricked-web";
function openDB() {
	return new Promise((resolve, reject) => {
		const request = indexedDB.open(DB_NAME, 1);
		request.onupgradeneeded = () => {
			request.result.createObjectStore("files");
			request.result.createObjectStore("meta");
		};
		request.onsuccess = () => resolve(request.result);
		request.onerror = () => reject(request.error);
	});
}
const idb = (db, store, mode, fn) => new Promise((resolve, reject) => {
	const tx = db.transaction(store, mode);
	const request = fn(tx.objectStore(store));
	tx.oncomplete = () => resolve(request && request.result);
	tx.onerror = () => reject(tx.error);
	tx.onabort = () => reject(tx.error);
});

function panel() {
	const box = document.createElement("div");
	box.style.cssText = "position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;" +
		"background:#0b0e16;color:#d8dbe5;font:16px system-ui,sans-serif;z-index:100000;text-align:center;padding:24px";
	document.body.appendChild(box);
	return box;
}

function heading() {
	const title = document.createElement("h1");
	title.textContent = "Age of Zombies";
	title.style.cssText = "margin:0;font-size:28px";
	return title;
}

function askForAPK(box) {
	return new Promise(resolve => {
		box.innerHTML = "";
		const text = document.createElement("p");
		text.style.cssText = "margin:0;max-width:34em;line-height:1.5";
		text.textContent = "HalfBricked does not include the game's files. Choose your own Age of Zombies APK (version 1.2.5 or 1.2.1) and the game builds itself from it, here in your browser. The file never leaves your device.";
		const label = document.createElement("label");
		label.textContent = "Choose the APK";
		label.style.cssText = "background:#c53d2b;color:#fff;padding:12px 22px;border-radius:6px;cursor:pointer;font-weight:600";
		const input = document.createElement("input");
		input.type = "file";
		input.accept = ".apk,application/vnd.android.package-archive,application/zip";
		input.style.display = "none";
		label.appendChild(input);
		const hint = document.createElement("p");
		hint.style.cssText = "margin:0;color:#8d94a8;font-size:14px";
		hint.textContent = "or drop the file on this page";
		box.append(heading(), text, label, hint);
		const take = file => { if (file) resolve(file); };
		input.onchange = () => take(input.files[0]);
		box.ondragover = e => e.preventDefault();
		box.ondrop = e => { e.preventDefault(); take(e.dataTransfer.files[0]); };
	});
}

function showProgress(box, message) {
	box.innerHTML = "";
	const line = document.createElement("p");
	line.style.cssText = "margin:0";
	line.id = "aoz-stage";
	line.textContent = message;
	const bar = document.createElement("div");
	bar.style.cssText = "width:min(420px,80vw);height:10px;background:#1f2433;border-radius:5px;overflow:hidden";
	const fill = document.createElement("div");
	fill.id = "aoz-fill";
	fill.style.cssText = "height:100%;width:0;background:#c53d2b;transition:width .15s";
	bar.appendChild(fill);
	const note = document.createElement("p");
	note.style.cssText = "margin:0;color:#8d94a8;font-size:14px";
	note.textContent = "This happens once. The next visit starts straight away.";
	box.append(heading(), line, bar, note);
}

async function persistCache(db, config, haveAPK) {
	const files = aozFS.list("/cache");
	await idb(db, "files", "readwrite", store => {
		for (const [path, bytes] of files) store.put(bytes.slice(), "cache:" + path);
	});
	await idb(db, "meta", "readwrite", store => store.put({ cacheVersion: config.cacheVersion || "", files: files.length, hasAPK: haveAPK }, "meta"));
	if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

function forgetEverything() {
	const request = indexedDB.deleteDatabase(DB_NAME);
	request.onsuccess = request.onerror = request.onblocked = () => location.reload();
}

async function startWithOwnAPK(config) {
	await loadScript("./memfs.js");
	await loadScript("./wasm_exec.js");
	const db = await openDB();
	const box = panel();
	status.remove();
	const meta = await idb(db, "meta", "readonly", store => store.get("meta"));
	let argv;
	if (meta && meta.files && meta.cacheVersion === (config.cacheVersion || "")) {
		// The cache built on an earlier visit.
		showProgress(box, "Loading your game files...");
		const keys = await idb(db, "files", "readonly", store => store.getAllKeys());
		const values = await idb(db, "files", "readonly", store => store.getAll());
		keys.forEach((key, i) => { if (String(key).startsWith("cache:")) aozFS.writeFile(String(key).slice(6), new Uint8Array(values[i])); });
		argv = ["aoz", "-assets", "/cache"];
	} else {
		let bytes = await idb(db, "files", "readonly", store => store.get("apk"));
		if (bytes) {
			bytes = new Uint8Array(bytes);
		} else {
			const file = await askForAPK(box);
			bytes = new Uint8Array(await file.arrayBuffer());
			await idb(db, "files", "readwrite", store => store.put(bytes.slice(), "apk"));
		}
		aozFS.writeFile("/game.apk", bytes);
		showProgress(box, "Reading the APK...");
		argv = ["aoz", "-assets", "/game.apk"];
		window.aozStatus = (stage, done, total) => {
			const line = document.getElementById("aoz-stage");
			const fill = document.getElementById("aoz-fill");
			if (line) line.textContent = stage + " (" + done + " of " + total + ")";
			if (fill && total) fill.style.width = Math.round(100 * done / total) + "%";
		};
		window.aozImportDone = () => { persistCache(db, config, true).catch(e => console.warn("could not keep the game files:", e)); };
	}
	const change = document.createElement("button");
	change.textContent = "Change APK";
	change.title = "Forget the stored APK and game files and choose another APK";
	change.style.cssText = "position:fixed;left:6px;bottom:6px;z-index:100001;font:11px system-ui;opacity:.35;background:#000;color:#fff;border:1px solid #444;border-radius:4px;padding:2px 6px;cursor:pointer";
	change.onclick = () => { if (confirm("Forget the stored APK and game files and choose another APK?")) forgetEverything(); };
	document.body.appendChild(change);
	// The game's canvas exists from the start, so the game says when it is ready to draw (platform.NotifyReady).
	window.aozReady = () => box.remove();
	const go = new Go();
	go.argv = argv;
	const result = await instantiate(go);
	go.run(result.instance);
}

(async () => {
	let config = {};
	try {
		const response = await fetch("./config.json", { cache: "no-store" });
		if (response.ok) config = await response.json();
	} catch (e) {}
	if (config.mode === "apk") {
		await startWithOwnAPK(config);
	} else {
		await loadScript("./wasm_exec.js");
		await startGame();
	}
})().catch(e => { status.textContent = "Could not start: " + e.message; console.error(e); });
</script>
</main>
</body>
</html>

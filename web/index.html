<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HalfBricked</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="shortcut icon" href="./favicon.ico">
<link rel="apple-touch-icon" href="./favicon.png">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#d8dbe5;font-family:system-ui,sans-serif}
main{position:fixed;inset:0}
#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);margin:0;color:#8d94a8}
/* The game lays itself out to the size of its canvas, so the canvas is the whole window. */
canvas{position:fixed;inset:0;display:block;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;image-rendering:auto}
</style>
</head>
<body>
<main>
<p id="status">Loading HalfBricked...</p>
<script src="./wasm_exec.js"></script>
<script>
const status = document.getElementById("status");
const go = new Go();
WebAssembly.instantiateStreaming(fetch("./aoz.wasm"), go.importObject).then(result => { status.remove(); go.run(result.instance); }).catch(async () => { const response = await fetch("./aoz.wasm"); const bytes = await response.arrayBuffer(); const result = await WebAssembly.instantiate(bytes, go.importObject); status.remove(); go.run(result.instance); });
</script>
</main>
</body>
</html>
